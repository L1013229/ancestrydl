# One weekly native batch for the existing Go and Actions updates (#7262).
version: 2
multi-ecosystem-groups:
  routine-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Auckland
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: routine-dependencies
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: routine-dependencies
