# One weekly native batch for the existing Go and Actions updates (#7262).
version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Auckland
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
