version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - misspell
    - unconvert
    - unparam
  settings:
    staticcheck:
      checks: ["S*", "SA*"]
    goconst:
      # Keep the v1 checker's scope: calls and composite literals were not checked.
      exclude-types: [Call, CompositeLit]
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
